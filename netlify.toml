# ==============================================================================
# Netlify Production Configuration
# Organization: SBBM Social Foundation
# Website: https://sbbmsocialfoundation.org
# ==============================================================================

[build]
  # When deployed from repository root: install client deps and build production bundle
  command = "npm --prefix client install && npm --prefix client run build"
  publish = "client/dist"
  environment = { NODE_VERSION = "20" }

# ------------------------------------------------------------------------------
# SPA Client-Side Routing (React Router 7)
# Ensures direct URL access and page refreshing on subroutes never return 404
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ------------------------------------------------------------------------------
# Security & Performance Headers
# ------------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; media-src 'self' data: blob:; connect-src 'self' http://localhost:* https:; frame-ancestors 'self';"

# Long-term immutable caching for hashed production assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache index.html so users always receive latest bundle references
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

